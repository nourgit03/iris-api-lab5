services:
  api:
    build: .
    image: iris-api:v1
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: compose
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
