apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-api
  namespace: iris
spec:
  ingressClassName: nginx
  rules:
    - host: iris.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iris-api
                port:
                  name: http
